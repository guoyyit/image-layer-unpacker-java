spring.application.name=image-layer-unpacker-java
server.port=8080

# Storage root for staged tars, layer rootfs trees and metadata.
unpacker.root-dir=./data
# Quota: max uncompressed bytes of a single layer.
unpacker.max-layer-bytes=268435456
# Quota: max total bytes of all committed layers.
unpacker.max-total-bytes=2147483648
# Quota: max entries in a single archive.
unpacker.max-entries-per-layer=100000

# Allow large tar uploads.
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB
spring.mvc.async.request-timeout=300000
