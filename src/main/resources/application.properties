# Local storage directory. When unset a fresh temporary directory is created on every start.
# imagelayer.storage-dir=./data/imagelayer-unpacker

# Maximum unpacked size of a single layer (bytes).
imagelayer.max-layer-bytes=10485760

# Maximum total unpacked size across all committed layers (bytes).
imagelayer.max-total-bytes=104857600

spring.servlet.multipart.enabled=false
